<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>HTTPS 合成测试页</title>
  <style>
    :root { color-scheme: light; font: 17px/1.65 system-ui, sans-serif; color: #19364a; background: #f4f7f9; }
    body { margin: 0; padding: 24px; }
    main { max-width: 42rem; margin: 8vh auto; padding: 28px; background: white; border: 1px solid #91a6b4; border-radius: 16px; }
    h1 { font-size: 1.6rem; line-height: 1.3; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p>仅用于连通性测试 · Synthetic test only</p>
    <h1>测试内容已显示</h1>
    <p>请在浏览器地址栏确认 HTTPS 和有效证书。能看到本页，仅说明此时可以取得这个静态页面。</p>
    <p>本页没有登录、账户、资料、数据库或模型连接。它不证明员工登录或权限系统可用。</p>
    <p lang="en">This page checks static HTTPS reachability only. It does not test sign-in, authorization, or database persistence.</p>
    <p>固定标记：<code>SYNTHETIC-HTTPS-ONLY-V1</code></p>
  </main>
</body>
</html>
